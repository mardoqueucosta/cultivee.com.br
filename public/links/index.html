<style>
:root{
  --deep:hsl(157 64% 14%);
  --deep-dark:hsl(157 70% 8%);
  --sun:hsl(40 77% 60%);
  --sun-hover:hsl(40 77% 66%);
  --agro-light:hsl(135 47% 46%);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Manrope',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  background:var(--deep-dark);color:#fff;-webkit-font-smoothing:antialiased;min-height:100vh;
}
.topo{position:relative;height:170px;overflow:hidden;background:var(--deep)}
.topo img{width:100%;height:100%;object-fit:cover;object-position:center 60%}
.topo::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,hsl(157 64% 14%/.15) 0%,hsl(157 64% 14%/.55) 55%,var(--deep) 100%)}
.fundo{background:linear-gradient(180deg,var(--deep) 0%,var(--deep-dark) 70%);padding:0 16px 40px}
main{max-width:440px;margin:0 auto;display:flex;flex-direction:column;align-items:center;text-align:center}
.foto{position:relative;z-index:1;margin-top:-62px;width:116px;height:116px;border-radius:50%;
  object-fit:cover;border:4px solid var(--deep);box-shadow:0 0 0 3px var(--sun),0 12px 30px rgba(0,0,0,.35)}
.marca{display:flex;align-items:center;gap:8px;margin-top:16px}
.marca svg{width:22px;height:22px;stroke:var(--agro-light)}
h1{font-family:'Lora',Georgia,serif;font-weight:600;font-size:1.75rem;letter-spacing:.01em}
.linha{margin-top:6px;font-size:1rem;line-height:1.45;color:rgba(255,255,255,.78);max-width:340px;text-wrap:balance}
nav{width:100%;margin-top:28px;display:flex;flex-direction:column;gap:12px}
.botao{
  display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border-radius:18px;text-align:left;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
  color:#fff;text-decoration:none;
  transition:background .18s ease,border-color .18s ease,transform .18s ease;
}
.botao:hover,.botao:focus-visible{background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.28);transform:translateY(-1px)}
.botao:active{transform:scale(.985)}
.icone{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  background:rgba(255,255,255,.1);color:var(--sun)}
.icone svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.texto{flex:1;min-width:0}
.texto strong{display:block;font-size:1rem;font-weight:700;line-height:1.3}
.texto span{display:block;margin-top:2px;font-size:.84rem;line-height:1.35;color:rgba(255,255,255,.68)}
.seta{flex:none;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:.55;transition:transform .18s ease,opacity .18s ease}
.botao:hover .seta{transform:translateX(3px);opacity:.9}
.botao.destaque{background:var(--sun);border-color:var(--sun);color:var(--deep);padding:16px 14px;
  box-shadow:0 10px 28px hsl(40 77% 60%/.22)}
.botao.destaque:hover,.botao.destaque:focus-visible{background:var(--sun-hover);border-color:var(--sun-hover)}
.botao.destaque .icone{background:var(--deep);color:var(--sun);width:44px;height:44px}
.botao.destaque .texto strong{font-size:1.08rem}
.botao.destaque .texto span{color:var(--deep);opacity:.78}
.botao.destaque .seta{opacity:.8}
.redes{display:flex;gap:10px;margin-top:32px}
.redes a{color:rgba(255,255,255,.82);display:grid;place-items:center;width:46px;height:46px;border-radius:50%;
  border:1px solid rgba(255,255,255,.16);transition:background .18s ease,color .18s ease}
.redes a:hover,.redes a:focus-visible{color:var(--deep);background:var(--sun);border-color:var(--sun)}
.redes svg{width:20px;height:20px;fill:currentColor}
footer{margin-top:28px;font-size:.8rem;color:rgba(255,255,255,.5)}
footer a{color:inherit;text-decoration:none}
footer a:hover{color:#fff}
a:focus-visible{outline:2px solid var(--sun);outline-offset:3px}
@media (prefers-reduced-motion:no-preference){
  .entra{opacity:0;transform:translateY(10px);animation:entra .35s ease both}
  @keyframes entra{to{opacity:1;transform:none}}
}
</style>

<script>
// Um ouvinte so: cada botao e cada rede manda `clique_links` com `botao` ao GA4.
// transport_type beacon: o evento sai mesmo com a pagina indo embora no clique.
document.addEventListener('click', function (e) {
  var a = e.target.closest && e.target.closest('a[data-botao]');
  if (!a || typeof gtag !== 'function') return;
  gtag('event', 'clique_links', {
    botao: a.getAttribute('data-botao'),
    destino: a.getAttribute('href'),
    transport_type: 'beacon'
  });
}, true);
</script>
